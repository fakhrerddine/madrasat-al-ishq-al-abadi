name: Build and deploy digital book
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout confirmed Word master
        uses: actions/checkout@v4
        with:
          repository: fakhrerddine/fakhreddine-book
          ref: main
          path: source-book
      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-core fonts-noto-extra
          sudo fc-cache -f
          python -m pip install --user python-docx
      - name: Inspect Word text and formatting before conversion
        env:
          DOCX: "source-book/assets/مدرسة العشق الأبدي الروحي - Copie_compressed.docx"
        run: |
          python - <<'PY'
          import os, re
          from docx import Document
          path=os.environ["DOCX"]
          doc=Document(path)
          print("DOCX paragraphs:", len(doc.paragraphs))
          shown=0
          for i,p in enumerate(doc.paragraphs):
              txt=p.text.strip()
              if not txt:
                  continue
              runs=[r for r in p.runs if r.text.strip()]
              sizes=[round(r.font.size.pt,1) for r in runs if r.font.size]
              colors=[r.font.color.rgb for r in runs if r.font.color and r.font.color.rgb]
              print(f"PARA {i} style={p.style.name!r} align={p.alignment} sizes={sizes[:8]} colors={list(map(str,colors[:8]))} text={txt[:220]!r}")
              shown+=1
              if shown>=35:
                  break
          joined="\n".join(p.text for p in doc.paragraphs)
          print("Arabic character count:", len(re.findall(r"[\\u0600-\\u06ff]", joined)))
          print("Double spaces:", joined.count("  "))
          print("No-space Arabic/Latin adjacency sample:", [x[:120] for x in joined.splitlines() if re.search(r"[\\u0600-\\u06ff][A-Za-z0-9]",x)][:8])
          PY
      - name: Apply safe Arabic typography and text color to a temporary copy
        env:
          DOCX: "source-book/assets/مدرسة العشق الأبدي الروحي - Copie_compressed.docx"
        run: |
          python - <<'PY'
          import os, zipfile, tempfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          src=Path(os.environ["DOCX"])
          dst=Path("/tmp/book-readable.docx")
          ns={"w":"http://schemas.openxmlformats.org/wordprocessingml/2006/main"}
          W="{"+ns["w"]+"}"
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst,"w",zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  data=zin.read(item.filename)
                  if item.filename.startswith("word/") and item.filename.endswith(".xml"):
                      try:
                          root=ET.fromstring(data)
                          changed=False
                          for rf in root.iter(W+"rFonts"):
                              rf.set(W+"cs","Noto Naskh Arabic")
                              changed=True
                          for color in root.iter(W+"color"):
                              val=(color.get(W+"val") or "").upper()
                              if val in ("000000","000","AUTO"):
                                  color.set(W+"val","27364B")
                                  changed=True
                          if item.filename=="word/styles.xml":
                              dd=root.find("w:docDefaults",ns)
                              if dd is None:
                                  dd=ET.Element(W+"docDefaults")
                                  root.insert(0,dd)
                              rd=dd.find("w:rPrDefault",ns)
                              if rd is None:
                                  rd=ET.SubElement(dd,W+"rPrDefault")
                              rp=rd.find("w:rPr",ns)
                              if rp is None:
                                  rp=ET.SubElement(rd,W+"rPr")
                              rf=rp.find("w:rFonts",ns)
                              if rf is None:
                                  rf=ET.SubElement(rp,W+"rFonts")
                              rf.set(W+"cs","Noto Naskh Arabic")
                              col=rp.find("w:color",ns)
                              if col is None:
                                  col=ET.SubElement(rp,W+"color")
                              col.set(W+"val","27364B")
                              changed=True
                          if changed:
                              data=ET.tostring(root,encoding="utf-8",xml_declaration=True)
                      except ET.ParseError:
                          pass
                  zout.writestr(item,data)
          print("Created temporary styled copy:",dst,"bytes:",dst.stat().st_size)
          PY
          fc-match "Noto Naskh Arabic"
      - name: Convert original Word book to PDF
        timeout-minutes: 15
        env:
          DOCX: "/tmp/book-readable.docx"
        run: |
          set -euo pipefail
          mkdir -p site/assets
          test -s "$DOCX"
          echo "Source DOCX size:"
          du -h "$DOCX"
          CONVERT_DOCX="site/assets/مدرسة العشق الأبدي الروحي - Copie_compressed.docx"
          cp "$DOCX" "$CONVERT_DOCX"
          mkdir -p /tmp/lo-profile
          timeout 12m libreoffice -env:UserInstallation=file:///tmp/lo-profile --headless --convert-to pdf --outdir site/assets "$CONVERT_DOCX"
          PDF="site/assets/مدرسة العشق الأبدي الروحي - Copie_compressed.pdf"
          test -s "$PDF"
          mv "$PDF" site/assets/book.pdf
          echo "Generated PDF size:"
          du -h site/assets/book.pdf
          pdfinfo site/assets/book.pdf | grep -E '^(Pages|Page size|File size):'
          test "$(pdfinfo site/assets/book.pdf | awk '/^Pages:/ {print $2}')" -gt 1
          pdftotext -f 1 -l 5 site/assets/book.pdf - | head -c 5000
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
