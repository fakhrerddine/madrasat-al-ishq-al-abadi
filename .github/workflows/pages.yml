name: Build and deploy digital book
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          path: site
      - name: Checkout confirmed Word master
        uses: actions/checkout@v4
        with:
          repository: fakhrerddine/fakhreddine-book
          ref: main
          path: source-book
      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer poppler-utils fonts-noto-core fonts-noto-extra
          sudo fc-cache -f
          python -m pip install --user python-docx
      - name: Inspect Word text and formatting before conversion
        env:
          DOCX: "source-book/assets/مدرسة العشق الأبدي الروحي - Copie_compressed.docx"
        run: |
          python - <<'PY'
          import os, re
          from docx import Document
          path=os.environ["DOCX"]
          doc=Document(path)
          print("DOCX paragraphs:", len(doc.paragraphs))
          shown=0
          for i,p in enumerate(doc.paragraphs):
              txt=p.text.strip()
              if not txt:
                  continue
              runs=[r for r in p.runs if r.text.strip()]
              sizes=[round(r.font.size.pt,1) for r in runs if r.font.size]
              colors=[r.font.color.rgb for r in runs if r.font.color and r.font.color.rgb]
              print(f"PARA {i} style={p.style.name!r} align={p.alignment} sizes={sizes[:8]} colors={list(map(str,colors[:8]))} text={txt[:220]!r}")
              shown+=1
              if shown>=35:
                  break
          joined="\n".join(p.text for p in doc.paragraphs)
          print("Arabic character count:", len(re.findall(r"[\\u0600-\\u06ff]", joined)))
          print("Double spaces:", joined.count("  "))
          print("No-space Arabic/Latin adjacency sample:", [x[:120] for x in joined.splitlines() if re.search(r"[\\u0600-\\u06ff][A-Za-z0-9]",x)][:8])
          PY
      - name: Apply Arabic typography, readable colors and clean highlights to temporary copy
        env:
          DOCX: "source-book/assets/مدرسة العشق الأبدي الروحي - Copie_compressed.docx"
        run: |
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          src=Path(os.environ["DOCX"])
          dst=Path("/tmp/book-readable.docx")
          WNS="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
          W="{"+WNS+"}"
          ET.register_namespace("w",WNS)
          BODY="34465E"
          HEADING_COLORS={"Titre1":"174A7E","Titre2":"2E74B5","Titre3":"A7833D",
                          "Titre1Car":"174A7E","Titre2Car":"2E74B5","Titre3Car":"A7833D"}
          def set_font(rpr):
              rf=rpr.find(W+"rFonts")
              if rf is None: rf=ET.SubElement(rpr,W+"rFonts")
              for attr in ("ascii","hAnsi","eastAsia","cs"):
                  rf.set(W+attr,"Noto Naskh Arabic")
              for attr in ("asciiTheme","hAnsiTheme","eastAsiaTheme","cstheme"):
                  rf.attrib.pop(W+attr,None)
          def set_color(rpr,color):
              c=rpr.find(W+"color")
              if c is None: c=ET.SubElement(rpr,W+"color")
              c.set(W+"val",color)
              for attr in ("themeColor","themeTint","themeShade"):
                  c.attrib.pop(W+attr,None)
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst,"w",zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  data=zin.read(item.filename)
                  if item.filename.startswith("word/") and item.filename.endswith(".xml"):
                      try:
                          root=ET.fromstring(data)
                          for rf in root.iter(W+"rFonts"):
                              for attr in ("ascii","hAnsi","eastAsia","cs"):
                                  rf.set(W+attr,"Noto Naskh Arabic")
                              for attr in ("asciiTheme","hAnsiTheme","eastAsiaTheme","cstheme"):
                                  rf.attrib.pop(W+attr,None)
                          parents={child:parent for parent in root.iter() for child in list(parent)}
                          for hi in list(root.iter(W+"highlight")):
                              parent=parents.get(hi)
                              if parent is not None: parent.remove(hi)
                          for style in root.iter(W+"style"):
                              sid=style.get(W+"styleId","")
                              rpr=style.find(W+"rPr")
                              if rpr is not None:
                                  set_font(rpr)
                                  if sid=="Normal": set_color(rpr,BODY)
                                  if sid in HEADING_COLORS: set_color(rpr,HEADING_COLORS[sid])
                          for rpr in root.iter(W+"rPr"):
                              set_font(rpr)
                              original_colors=[(x.get(W+"val") or "").upper() for x in rpr.findall(W+"color")]
                              original=next((x for x in original_colors if x), "")
                              # Make body copy genuinely readable, with larger chapter/title hierarchy.
                              points=36
                              if original=="FF0000":
                                  points=52
                              elif original in ("002060","1F4E79","17365D","174A7E","2F5496","4472C4"):
                                  points=44
                              elif original in ("833C0B","843C0C","C65911","A84300","BF9000","C55A11"):
                                  points=40
                              for tag in ("sz","szCs"):
                                  node=rpr.find(W+tag)
                                  if node is None: node=ET.SubElement(rpr,W+tag)
                                  node.set(W+"val",str(points))
                              for color in rpr.findall(W+"color"):
                                  val=(color.get(W+"val") or "").upper()
                                  if val in ("000000","000","AUTO","2A2118"):
                                      color.set(W+"val",BODY)
                                  elif val in ("FF0000","833C0B","843C0C","C65911","A84300","BF9000","C55A11"):
                                      color.set(W+"val","A7833D")
                                  elif val in ("002060","1F4E79","17365D","174A7E","2F5496","4472C4"):
                                      color.set(W+"val","174A7E")
                          if item.filename=="word/styles.xml":
                              dd=root.find(W+"docDefaults")
                              if dd is None:
                                  dd=ET.Element(W+"docDefaults"); root.insert(0,dd)
                              rd=dd.find(W+"rPrDefault")
                              if rd is None: rd=ET.SubElement(dd,W+"rPrDefault")
                              rpr=rd.find(W+"rPr")
                              if rpr is None: rpr=ET.SubElement(rd,W+"rPr")
                              set_font(rpr); set_color(rpr,BODY)
                          data=ET.tostring(root,encoding="utf-8",xml_declaration=True)
                      except ET.ParseError:
                          pass
                  zout.writestr(item,data)
          print("Created temporary styled copy:",dst,"bytes:",dst.stat().st_size)
          PY
          fc-match "Noto Naskh Arabic"
      - name: Convert original Word book to PDF
        timeout-minutes: 15
        env:
          DOCX: "/tmp/book-readable.docx"
        run: |
          set -euo pipefail
          mkdir -p site/assets
          test -s "$DOCX"
          echo "Source DOCX size:"
          du -h "$DOCX"
          CONVERT_DOCX="site/assets/مدرسة العشق الأبدي الروحي - Copie_compressed.docx"
          cp "$DOCX" "$CONVERT_DOCX"
          mkdir -p /tmp/lo-profile
          timeout 12m libreoffice -env:UserInstallation=file:///tmp/lo-profile --headless --convert-to pdf --outdir site/assets "$CONVERT_DOCX"
          PDF="site/assets/مدرسة العشق الأبدي الروحي - Copie_compressed.pdf"
          test -s "$PDF"
          mv "$PDF" site/assets/book.pdf
          echo "Generated PDF size:"
          du -h site/assets/book.pdf
          pdfinfo site/assets/book.pdf | grep -E '^(Pages|Page size|File size):'
          test "$(pdfinfo site/assets/book.pdf | awk '/^Pages:/ {print $2}')" -gt 1
          pdftotext -f 1 -l 5 site/assets/book.pdf - | head -c 5000
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
