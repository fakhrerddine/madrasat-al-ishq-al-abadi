name: Build and deploy digital book
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout website and latest book PDF
        uses: actions/checkout@v4
        with:
          path: site
      - name: Install PDF page renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Publish latest PDF and render page images
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p site/assets/pages
          SOURCE_PDF="site/مدرسة العشق الأبدي الروحي - Copie_compressed.pdf"
          test -s "$SOURCE_PDF"
          cp "$SOURCE_PDF" site/assets/book.pdf
          echo "Latest PDF copied without modification:"
          pdfinfo site/assets/book.pdf | grep -E '^(Pages|Page size|File size):'
          pdftoppm -jpeg -scale-to 1800 -jpegopt quality=88,optimize=y site/assets/book.pdf site/assets/pages/page
          python - <<'PY'
          import json
          from pathlib import Path
          pages=sorted(Path("site/assets/pages").glob("page-*.jpg"),
                       key=lambda p:int(p.stem.split("-")[-1]))
          if len(pages)<2:
              raise SystemExit("PDF page rendering failed: fewer than two page images")
          manifest=[p.name for p in pages]
          Path("site/assets/pages/manifest.json").write_text(
              json.dumps(manifest,ensure_ascii=False),encoding="utf-8")
          print("Rendered page images:",len(pages))
          print("First pages:",manifest[:3])
          print("Last page:",manifest[-1])
          PY
          du -sh site/assets/book.pdf site/assets/pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
