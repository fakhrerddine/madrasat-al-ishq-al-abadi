<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101d36">
<title>مدرسة العشق الأبدي الروحي | فخرالدين حمادي</title>
<style>
:root{--navy:#101d36;--gold:#d8b65e;--cream:#f4ead1}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#29466f,#101d36 70%);color:#f7f0e4;font-family:Tahoma,Arial,sans-serif}
header{text-align:center;padding:22px 12px 16px;border-bottom:1px solid #d8b65e66}
.brand{font-size:12px;letter-spacing:2px;color:#e8c979}
h1{margin:9px 0;color:#f0cf76;font-size:clamp(25px,4vw,40px);text-shadow:0 2px 5px #0008}
.subtitle{color:#e3d2a9}
.lang-switch,.toolbar{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.lang-switch{margin-top:14px}
.toolbar{padding:12px;background:#101d36ed;border-bottom:1px solid #d8b65e66}
button,.download{border:1px solid #d8b65e;background:#332b49;color:#fff4df;border-radius:9px;padding:9px 14px;font:inherit;text-decoration:none;cursor:pointer}
button.active{background:#c6a85f;color:#17233b}
main{max-width:none;width:100%;margin:0 auto;padding:4px}
.notice{text-align:center;color:#e9dcbf;margin:8px 0 14px}
.viewer{width:100%;height:calc(100vh - 165px);min-height:620px;border:2px solid #d8b65e;border-radius:10px;background:radial-gradient(ellipse,#536b87,#172b49);box-shadow:0 20px 60px #0009;padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#book{width:100%;height:calc(100vh - 180px);max-height:none;margin:auto}
.page{background:#f4ead1;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 18px #0005}
.page canvas{display:block;width:100%;height:100%;object-fit:contain;background:#f4ead1}
.flip-controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:14px}
#pageCount{color:#f0d99f;min-width:100px;text-align:center}
#fallback{display:inline-block}
footer{text-align:center;color:#d8cba9;font-size:12px;padding:16px}
@media(max-width:650px){.viewer{height:80vh;min-height:540px;padding:2px}#book{height:77vh;width:100%}main{padding:3px}}
</style>
</head>
<body>
<header>
<div class="brand">FAKHREDDINE HAMMADI · DIGITAL BOOK</div>
<h1 id="title">مدرسة العشق الأبدي الروحي</h1>
<div class="subtitle" id="subtitle">فلسفة العشق والغرام والهيام</div>
<div class="lang-switch">
<button class="active" data-lang="ar">العربية</button>
<button data-lang="es">Español</button>
<button data-lang="fr">Français</button>
</div>
</header>
<nav class="toolbar">
<a class="download" href="./assets/book.pdf" download id="download">تحميل PDF</a>
<a class="download" href="./assets/book.pdf" target="_blank" rel="noopener" id="open">فتح PDF في نافذة مستقلة</a>
<a class="download" href="https://raw.githubusercontent.com/fakhrerddine/fakhreddine-book/main/assets/%D9%85%D8%AF%D8%B1%D8%B3%D8%A9%20%D8%A7%D9%84%D8%B9%D8%B4%D9%82%20%D8%A7%D9%84%D8%A3%D8%A8%D8%AF%D9%8A%20%D8%A7%D9%84%D8%B1%D9%88%D8%AD%D9%8A%20-%20Copie_compressed.docx" target="_blank" rel="noopener" id="word">تحميل Word الأصلي</a>
</nav>
<main>
<p class="notice" id="notice">النسخة الأصلية من PDF معروضة مباشرة دون قصّ أو تمديد للغلاف والصور. استعمل أدوات القارئ للتكبير والتنقل.</p>
<div class="flip-controls"><button id="backPage">◀ الصفحة السابقة</button><span id="pageCount">جارٍ التحضير…</span><button id="forwardPage">الصفحة التالية ▶</button><a class="download" id="fallback" href="./assets/book.pdf" target="_blank" rel="noopener">فتح PDF الأصلي</a></div>
<section class="viewer" aria-label="كتاب بتقليب الصفحات">
<div id="book"></div>
</section>
</main>
<footer>© Fakhreddine Hammadi</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>
<script>
(async()=>{
 const count=document.getElementById("pageCount"),host=document.getElementById("book");
 const prev=document.getElementById("backPage"),next=document.getElementById("forwardPage");
 let pdf,flip,rendering=new Set(),total=0;
 const setCount=()=>{const n=flip.getCurrentPageIndex()+1;count.textContent=n+" / "+total;prev.disabled=n===1;next.disabled=n===total;renderNear(n-1)};
 async function draw(n,canvas){
  if(rendering.has(n))return;rendering.add(n);
  try{
   const page=await pdf.getPage(n),base=page.getViewport({scale:1});
   const targetW=1200,targetH=1695;
   const scale=Math.min(targetW/base.width,targetH/base.height,2.4);
   const vp=page.getViewport({scale});
   canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);
   await page.render({canvasContext:canvas.getContext("2d",{alpha:false}),viewport:vp}).promise;
   canvas.dataset.rendered="true";
  }finally{rendering.delete(n)}
 }
 async function renderNear(i){
  const nodes=host.querySelectorAll(".page");
  const jobs=[];
  for(let k=Math.max(0,i-2);k<=Math.min(total-1,i+3);k++){
   const c=nodes[k]?.querySelector("canvas");
   if(c&&!c.dataset.rendered)jobs.push(draw(k+1,c));
  }
  await Promise.all(jobs);
 }
 try{
  if(!window.pdfjsLib||!window.St?.PageFlip)throw new Error("تعذر تحميل قارئ الصفحات");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  pdf=await pdfjsLib.getDocument("./assets/book.pdf").promise;total=pdf.numPages;
  const pages=[];
  for(let n=1;n<=total;n++){
   const el=document.createElement("div");el.className="page";
   if(n===1||n===total)el.classList.add("hard");
   const c=document.createElement("canvas");el.appendChild(c);pages.push(el);
  }
  host.replaceChildren(...pages);
  flip=new St.PageFlip(host,{width:900,height:1270,size:"stretch",minWidth:320,maxWidth:1500,minHeight:452,maxHeight:2100,autoSize:true,showCover:true,usePortrait:true,drawShadow:true,maxShadowOpacity:.35,flippingTime:850,swipeDistance:24,clickEventForward:true,useMouseEvents:true,mobileScrollSupport:false});
  flip.loadFromHTML(host.querySelectorAll(".page"));
  flip.on("flip",setCount);
  prev.onclick=()=>flip.flipPrev();next.onclick=()=>flip.flipNext();
  setCount();await renderNear(0);
 }catch(e){count.textContent="تعذر تشغيل التقليب";const link=document.createElement("a");link.className="download";link.href="./assets/book.pdf";link.target="_blank";link.textContent="فتح PDF الأصلي";host.replaceChildren(link);console.error(e)}
})();
</script>
<script>
const translations={
ar:{title:"مدرسة العشق الأبدي الروحي",subtitle:"فلسفة العشق والغرام والهيام",download:"تحميل PDF",open:"فتح PDF في نافذة مستقلة",word:"تحميل Word الأصلي",notice:"النسخة الأصلية من PDF معروضة مباشرة دون قصّ أو تمديد للغلاف والصور. استعمل أدوات القارئ للتكبير والتنقل."},
es:{title:"La escuela del amor eterno espiritual",subtitle:"Filosofía del amor, la pasión y el anhelo",download:"Descargar PDF",open:"Abrir PDF en una ventana",word:"Descargar Word original",notice:"El PDF original se muestra directamente, sin recortar ni estirar la portada ni las imágenes. Usa los controles del lector para ampliar y navegar."},
fr:{title:"L’École de l’amour éternel spirituel",subtitle:"Philosophie de l’amour, de la passion et du désir",download:"Télécharger PDF",open:"Ouvrir le PDF dans une fenêtre",word:"Télécharger le Word original",notice:"Le PDF original est affiché directement, sans recadrage ni déformation de la couverture ou des images. Utilisez les commandes du lecteur pour zoomer et naviguer."}
};
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{
const d=translations[b.dataset.lang];document.documentElement.lang=b.dataset.lang;document.documentElement.dir=b.dataset.lang==="ar"?"rtl":"ltr";
for(const [id,key] of [["title","title"],["subtitle","subtitle"],["download","download"],["open","open"],["word","word"],["notice","notice"]])document.getElementById(id).textContent=d[key];
document.querySelectorAll("[data-lang]").forEach(x=>x.classList.toggle("active",x===b));
}));
</script>
</body>
</html>
